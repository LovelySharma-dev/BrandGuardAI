<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="BrandGuard AI: evidence-gated pre-publication brand governance" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1917"/>
      <stop offset="1" stop-color="#44403c"/>
      <animate attributeName="x2" values="1;0.6;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b45309" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d9a066" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b45309" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="900" height="240" rx="16"/></clipPath>
  </defs>
  <style>
    .title{font:700 44px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#fafaf9;letter-spacing:1px}
    .sub{font:400 17px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#d6d3d1}
    .chip{font:600 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#1c1917}
    .fade{opacity:0;animation:fade 12s infinite}
    .s1{animation-delay:0s}.s2{animation-delay:3s}.s3{animation-delay:6s}.s4{animation-delay:9s}
    @keyframes fade{0%{opacity:0;transform:translateY(6px)}4%,22%{opacity:1;transform:translateY(0)}27%,100%{opacity:0}}
    .shield{transform-origin:110px 120px;animation:pulse 3s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
    .tick{stroke-dasharray:60;stroke-dashoffset:60;animation:draw 3s ease-in-out infinite}
    @keyframes draw{0%,15%{stroke-dashoffset:60}45%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:60}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="900" height="240" fill="url(#bg)"/>
    <rect y="0" width="260" height="240" fill="url(#scan)">
      <animate attributeName="x" values="-260;900" dur="5s" repeatCount="indefinite"/>
    </rect>
    <g opacity="0.12" stroke="#fafaf9">
      <path d="M0 60H900M0 120H900M0 180H900"/>
    </g>
  </g>
  <g class="shield">
    <path d="M110 66 L158 84 V122 C158 150 138 168 110 180 C82 168 62 150 62 122 V84 Z" fill="#b45309" stroke="#fde68a" stroke-width="3"/>
    <path class="tick" d="M88 122 L105 140 L134 104" fill="none" stroke="#fafaf9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="title" x="200" y="110">BrandGuard AI</text>
  <g>
    <text class="sub fade s1" x="202" y="148">Evidence-gated pre-publication brand governance</text>
    <text class="sub fade s2" x="202" y="148">Findings cite approved sources, or name the evidence gap</text>
    <text class="sub fade s3" x="202" y="148">A person accepts suggestions and approves the draft</text>
    <text class="sub fade s4" x="202" y="148">Review output never sets a draft to approved</text>
  </g>
  <g transform="translate(202 178)">
    <rect width="86" height="26" rx="13" fill="#d9a066"><animate attributeName="opacity" values="1;0.55;1" dur="3s" repeatCount="indefinite"/></rect>
    <text class="chip" x="43" y="18" text-anchor="middle">verified</text>
    <rect x="98" width="104" height="26" rx="13" fill="#fca5a5"><animate attributeName="opacity" values="1;0.55;1" dur="3s" begin="0.75s" repeatCount="indefinite"/></rect>
    <text class="chip" x="150" y="18" text-anchor="middle">contradicted</text>
    <rect x="214" width="104" height="26" rx="13" fill="#e7e5e4"><animate attributeName="opacity" values="1;0.55;1" dur="3s" begin="1.5s" repeatCount="indefinite"/></rect>
    <text class="chip" x="266" y="18" text-anchor="middle">unsupported</text>
  </g>
</svg>
